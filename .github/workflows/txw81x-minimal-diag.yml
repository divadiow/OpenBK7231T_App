name: TXW81X minimal diagnostic

on:
  push:
    branches:
      - txw81x-minimal-diag
    paths:
      - '.github/workflows/txw81x-minimal-diag.yml'
      - 'platforms/TXW81X/OpenBeken.mk'
      - 'platforms/TXW81X/txw81x_diag_main.c'
      - 'tools/txw81x_diag_capture.ps1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: txw81x-minimal-diag
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Checkout only OpenTXW81X
        shell: bash
        run: git submodule update --init --depth=1 sdk/OpenTXW81X

      - name: Extract C-SKY toolchain
        shell: bash
        run: |
          set -euxo pipefail
          cd sdk/OpenTXW81X/tools/gcc
          if [ ! -e csky-elfabiv2 ]; then
            tar -xf *.tar.gz
          fi

      - name: Obtain previously byte-validated native TXW81X packer
        shell: bash
        run: |
          set -euxo pipefail
          git fetch --depth=1 origin txw81x-python-packaging-research
          git show FETCH_HEAD:tools/txw81x_pack/txw81x_pack.py > /tmp/txw81x_pack.py
          python3 -m py_compile /tmp/txw81x_pack.py

      - name: Build through the known-working OpenTXW81X compile/link path
        id: firmware_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/published"
          {
            set -x
            cd sdk/OpenTXW81X/project
            make clean || true
            make APP_VERSION=diag_v03 -j2
            test -s project.hex
            test -s project.bin

            python3 /tmp/txw81x_pack.py pack-app \
              --input project.hex \
              --parameter-cfg parameter.bincfg \
              --makecode-ini makecode.ini \
              --sdk-version 02050307 \
              --svn-version 8EB5 \
              --app-version 0 \
              --date 2026-08-19 \
              --output APP.bin

            python3 /tmp/txw81x_pack.py inspect APP.bin
            test -s APP.bin
            grep -a -q 'TXWDIAG READY v=0.3' APP.bin
            grep -a -q 'TXWDIAG PONG v=0.3' APP.bin
            ls -l project.elf project.hex project.bin APP.bin
          } 2>&1 | tee "$GITHUB_WORKSPACE/published/TXW817_810_DIAG_MINIMAL_v03_build.log"

      - name: Prepare minimal test files if build succeeded
        if: steps.firmware_build.outcome == 'success'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p _txwdiag published
          cp sdk/OpenTXW81X/project/APP.bin _txwdiag/TXW817_810_DIAG_MINIMAL_v03.bin
          cp _txwdiag/TXW817_810_DIAG_MINIMAL_v03.bin published/TXW817_810_DIAG_MINIMAL_v03.bin
          cp tools/txw81x_diag_capture.ps1 _txwdiag/txw81x_diag_capture.ps1
          printf '@echo off\r\npowershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "%%~dp0txw81x_diag_capture.ps1" %%*\r\npause\r\n' > _txwdiag/2_CAPTURE_TXW817_810.cmd

      - name: Upload minimal test files
        if: steps.firmware_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: TXW817_810_DIAG_MINIMAL_v03
          path: _txwdiag
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      - name: Publish result back to test branch
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f published/TXW817_810_DIAG_MINIMAL_v03_build.log
          if [ -f published/TXW817_810_DIAG_MINIMAL_v03.bin ]; then
            git add -f published/TXW817_810_DIAG_MINIMAL_v03.bin
          fi
          if git diff --cached --quiet; then
            echo 'No result change to publish.'
          else
            git commit -m 'Publish TXW817 minimal diagnostic v0.3 build result'
            git push origin HEAD:txw81x-minimal-diag
          fi

      - name: Fail job if firmware build failed
        if: steps.firmware_build.outcome != 'success'
        shell: bash
        run: exit 1

name: Remove temporary refs

on:
  pull_request:
    branches: ["temporary-ref-cleanup-base"]

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Close cleanup PR and remove disposable refs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" -f state=closed
          for ref in temporary-ref-cleanup-trigger connectplus-enhanced-trigger connectplus-enhanced-builder temporary-ref-cleanup-base; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${ref}" || true
          done

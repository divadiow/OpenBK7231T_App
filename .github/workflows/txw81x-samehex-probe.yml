name: TXW81x vendor/Python code-length edge test

on:
  push:
    branches:
      - agent/txw81x-samehex-probe

permissions:
  contents: read

jobs:
  boundary:
    name: Compare Taixin/Python at 512-byte code boundaries
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: wsl-bash {0}
    steps:
      - name: Checkout corrected packer
        uses: actions/checkout@v5

      - name: Set up original Windows SDK tooling via WSL1
        uses: Vampire/setup-wsl@v7
        with:
          wsl-version: 1
          distribution: Ubuntu-22.04
          additional-packages: python3 make

      - name: Initialise SDK and Windows-checkout compatibility
        run: |
          set -euo pipefail
          git submodule update --init --recursive --depth=1 sdk/OpenTXW81X
          python3 - <<'PY'
          from pathlib import Path
          p = Path('platforms/TXW81X/package_native.sh')
          p.write_bytes(p.read_bytes().replace(b'\r\n', b'\n'))
          PY
          mkdir -p evidence

      - name: Package synthetic raw HEX at alignment boundaries
        run: |
          set -euo pipefail
          project=sdk/OpenTXW81X/project
          cp "$project/parameter.bincfg" "$project/parameter.cfg"
          for size in 12286 12287 12288 12289 12799 12800; do
            echo "------- Raw compiler code length: $size ($(printf '0x%X' "$size")) -------"
            d="evidence/$size"
            mkdir -p "$d"
            python3 - "$size" "$project/project.hex" <<'PY'
          import sys,struct
          from pathlib import Path
          n=int(sys.argv[1])
          out=Path(sys.argv[2])
          raw=bytearray((i*13+7)&255 for i in range(n))
          struct.pack_into('<H',raw,0x180,0x800)
          raw[0x182:0x980]=bytes(0x7fe)
          def record(addr,typ,chunk):
              payload=bytes((len(chunk),addr>>8,addr&255,typ))+chunk
              return ':'+(payload+bytes(((-sum(payload))&255,))).hex().upper()
          lines=[record(0,4,struct.pack('>H',0x1800))]
          lines.extend(record(i,0,raw[i:i+32]) for i in range(0,n,32))
          lines.append(record(0,1,b''))
          out.write_text('\n'.join(lines)+'\n',encoding='ascii')
          PY
            cp "$project/project.hex" "$d/project.hex"
            rm -f "$project/APP.bin" "$project/APP_compress.bin"
            (
              cd "$project"
              ./BinScript.exe BinScript.BinScript
              ./makecode.exe
              test -s APP.bin
              test -s APP_compress.bin
            )
            cp "$project/txw81x_fpv.bin" "$d/vendor-remapped.bin"
            cp "$project/APP.bin" "$d/vendor-APP.bin"
            cp "$project/APP_compress.bin" "$d/vendor-OTA.img"
            python3 - "$d/vendor-APP.bin" > "$d/date.txt" <<'PY'
          import sys,importlib.util
          from pathlib import Path
          f=Path('tools/txw81x_pack/txw81x_pack.py')
          spec=importlib.util.spec_from_file_location('txw81x_pack',f)
          obj=importlib.util.module_from_spec(spec)
          sys.modules[spec.name]=obj
          spec.loader.exec_module(obj)
          info=obj.parse_app_image(Path(sys.argv[1]).read_bytes())
          d=info['firmware']['date']
          print(f'{d>>16:04d}-{(d>>8)&255:02d}-{d&255:02d}')
          PY
            TXW81X_BUILD_DATE="$(cat "$d/date.txt")" sh platforms/TXW81X/package_native.sh > "$d/python-log.txt"
            cp "$project/APP.bin" "$d/python-APP.bin"
            cp "$project/APP_compress.bin" "$d/python-OTA.img"
            sha256sum "$d"/*.bin "$d"/*.img > "$d/hashes.sha256"
            echo "Input length $size, vendor remapped $(wc -c < "$d/vendor-remapped.bin"), APP vendor $(wc -c < "$d/vendor-APP.bin"), Python $(wc -c < "$d/python-APP.bin")"
          done

      - name: Summarise all binary differences
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path('evidence')
          report=[]
          for folder in sorted([x for x in root.iterdir() if x.is_dir()],key=lambda x:int(x.name)):
              entry={'compiler_code_length':int(folder.name),'tests':{}}
              for label,extension in [('APP','bin'),('OTA','img')]:
                  vend=(folder/f'vendor-{label}.{extension}').read_bytes()
                  native=(folder/f'python-{label}.{extension}').read_bytes()
                  mismatches=[i for i,(a,b) in enumerate(zip(vend,native)) if a!=b]
                  entry['tests'][label]={
                    'vendor_length':len(vend),
                    'python_length':len(native),
                    'identical':vend==native,
                    'different_bytes_over_common_length':len(mismatches),
                    'first_mismatched_offsets':[hex(i) for i in mismatches[:30]],
                    'vendor_sha256':hashlib.sha256(vend).hexdigest(),
                    'python_sha256':hashlib.sha256(native).hexdigest()
                  }
              report.append(entry)
              print(folder.name, {k:(v['vendor_length'],v['python_length'],v['identical']) for k,v in entry['tests'].items()})
          (root/'boundary-report.json').write_text(json.dumps(report,indent=2)+'\n')
          PY

      - name: Upload raw HEX and vendor/Python comparisons
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: txw81x-boundary-comparisons
          path: evidence/
          if-no-files-found: warn

      - name: Fail if code-length boundary diverges
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('evidence/boundary-report.json').read_text())
          mismatches=[(case['compiler_code_length'],kind) for case in report for kind,v in case['tests'].items() if not v['identical']]
          if mismatches: raise SystemExit(f'Taixin versus Python parity differs: {mismatches}')
          print('All six boundary APP and OTA cases match Taixin exactly')
          PY

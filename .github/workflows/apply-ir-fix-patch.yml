name: Apply isolated IR fix patch

on:
  push:
    branches:
      - agent/irremote-fix-runner
    paths:
      - .github/ir-fix.patch
      - .github/workflows/apply-ir-fix-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch runner
        uses: actions/checkout@v4
        with:
          ref: agent/irremote-fix-runner
          path: runner

      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: irremotesp8266_290
          fetch-depth: 0
          path: target

      - name: Validate, commit, and push patch
        shell: bash
        run: |
          set -euo pipefail
          patch_file="$GITHUB_WORKSPACE/runner/.github/ir-fix.patch"
          commit_message="$(sed -n '1s/^# COMMIT: //p' "$patch_file")"
          expected_base="$(sed -n '2s/^# BASE: //p' "$patch_file")"
          actual_base="$(git -C "$GITHUB_WORKSPACE/target" rev-parse HEAD)"

          test -n "$commit_message"
          test -n "$expected_base"
          test "$actual_base" = "$expected_base"

          tail -n +3 "$patch_file" > "$RUNNER_TEMP/ir-fix.diff"
          git -C "$GITHUB_WORKSPACE/target" apply --check "$RUNNER_TEMP/ir-fix.diff"
          git -C "$GITHUB_WORKSPACE/target" apply "$RUNNER_TEMP/ir-fix.diff"
          git -C "$GITHUB_WORKSPACE/target" diff --check

          git -C "$GITHUB_WORKSPACE/target" config user.name "openai-agent"
          git -C "$GITHUB_WORKSPACE/target" config user.email "openai-agent@users.noreply.github.com"
          git -C "$GITHUB_WORKSPACE/target" add --all
          git -C "$GITHUB_WORKSPACE/target" commit -m "$commit_message"
          git -C "$GITHUB_WORKSPACE/target" push origin HEAD:irremotesp8266_290

name: ECR6600 Minimal SDK Sleep Tests

on:
  push:
    branches:
      - ecr6600-raw-sleep-test
    paths-ignore:
      - .ci/ecr6600_raw_sleep_run.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ecr6600-raw-sleep-test

      - name: Checkout OpenECR6600 submodule
        run: git submodule update --init --recursive --depth=1 sdk/OpenECR6600

      - name: Install 32-bit runtime support
        run: |
          sudo apt-get update
          sudo apt-get install -y libc6-i386

      - name: Restore minimal test sources
        run: |
          base64 -d tools/ecr6600_raw_sleep_test_bundle.tar.gz.b64 | tar -xzf -

      - name: Build isolation variants
        run: bash tools/ecr6600_raw_sleep_test/build_raw_sleep_tests.sh

      - name: Upload compiled firmware and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: ECR6600F_v2.1.23.16_minimal_sleep_test_firmware
          path: raw_sleep_artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish run ID for retrieval
        if: always()
        run: |
          mkdir -p .ci
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "head_sha=${GITHUB_SHA}"
            echo "completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > .ci/ecr6600_raw_sleep_run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/ecr6600_raw_sleep_run.txt
          if ! git diff --cached --quiet; then
            git commit -m "ci: publish ECR6600 sleep-test run ${GITHUB_RUN_ID} [skip ci]"
            git push origin HEAD:ecr6600-raw-sleep-test
          fi

name: ECR6600 Minimal SDK RF-Close Sleep Test

on:
  push:
    branches:
      - ecr6600-raw-sleep-rfclose-test2
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ecr6600-raw-sleep-rfclose-test2

      - name: Checkout OpenECR6600 submodule
        run: git submodule update --init --recursive --depth=1 sdk/OpenECR6600

      - name: Install 32-bit runtime support
        run: |
          sudo apt-get update
          sudo apt-get install -y libc6-i386

      - name: Restore minimal test sources
        run: |
          base64 -d tools/ecr6600_raw_sleep_test_bundle.tar.gz.b64 | tar -xzf -

      - name: Supply WiFi library diagnostic global
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/ecr6600_raw_sleep_test/board/main.c')
          source = path.read_text(encoding='utf-8')
          needle = 'extern int psm_clear_pcu_isr(void);\n'
          replacement = needle + '\n/* Referenced by the closed WiFi libraries even when vendor CLI commands are omitted. */\nuint8_t g_enable_cmw = 0U;\n'
          if source.count(needle) != 1:
              raise SystemExit('Could not locate psm_clear_pcu_isr declaration')
          path.write_text(source.replace(needle, replacement, 1), encoding='utf-8', newline='\n')
          PY

      - name: Patch Variant B to close RF before deep sleep
        run: python3 tools/ecr6600_raw_sleep_test/patch_rfclose_variant.py

      - name: Build RF-close isolation firmware
        run: bash tools/ecr6600_raw_sleep_test/build_raw_sleep_tests.sh

      - name: Upload compiled firmware and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: ECR6600F_v2.1.23.16_RawSleepB_RFClosed
          path: raw_sleep_artifacts/
          if-no-files-found: error
          retention-days: 30

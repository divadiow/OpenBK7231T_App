name: Monitor IR target Build App run

on:
  push:
    branches:
      - agent/irremote-fix-runner
    paths:
      - .github/workflows/monitor-ir-target-build.yml

permissions:
  actions: read
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out helper branch
        uses: actions/checkout@v4
        with:
          ref: agent/irremote-fix-runner
          fetch-depth: 0

      - name: Record concise target-run status
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: "29892296110"
        shell: bash
        run: |
          set -euo pipefail
          run_json="$RUNNER_TEMP/run.json"
          jobs_json="$RUNNER_TEMP/jobs.json"
          out=".github/ir-target-build-status.txt"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}" > "$run_json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}/jobs?per_page=100" > "$jobs_json"
          {
            jq -r '"run_id=\(.id) status=\(.status) conclusion=\(.conclusion // "") head_sha=\(.head_sha)"' "$run_json"
            jq -r 'group_by(.status)[] | "status_\(.[0].status)=\(length)"' < <(jq -c '.jobs | sort_by(.status)' "$jobs_json")
            jq -r 'group_by(.conclusion // "none")[] | "conclusion_\(.[0].conclusion // "none")=\(length)"' < <(jq -c '.jobs | sort_by(.conclusion // "none")' "$jobs_json")
            jq -r '.jobs[] | select(.conclusion == "failure") | "FAIL\t\(.id)\t\(.name)"' "$jobs_json"
          } > "$out"
          git config user.name "openai-agent"
          git config user.email "openai-agent@users.noreply.github.com"
          git add "$out"
          if ! git diff --cached --quiet; then
            git commit -m "runner: record target IR build status"
            git push origin HEAD:agent/irremote-fix-runner
          fi


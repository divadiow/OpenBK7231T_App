name: Inspect IR validation workflow

on:
  push:
    branches:
      - agent/irremote-fix-runner
    paths:
      - .github/workflows/inspect-ir-ci.yml

permissions:
  actions: write
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cancel obsolete helper matrices
        env:
          GH_TOKEN: ${{ github.token }}
          CANCEL_RUNS: '29866265992 29866386937'
        shell: bash
        run: |
          set -euo pipefail
          for run_id in ${CANCEL_RUNS}; do
            curl --fail --silent --show-error -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true
          done
          printf '%s\n' "cancelled obsolete helper runs: ${CANCEL_RUNS}" > .github/last-ir-ci-cancelled.txt
      - name: Commit summary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "openai-agent"
          git config user.email "openai-agent@users.noreply.github.com"
          git add .github/last-ir-ci-cancelled.txt
          git commit -m "ci: record cancelled helper runs"
          git push

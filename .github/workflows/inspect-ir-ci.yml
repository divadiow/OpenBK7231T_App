name: Inspect IR validation CI failure

on:
  push:
    branches:
      - agent/irremote-fix-runner
    paths:
      - .github/workflows/inspect-ir-ci.yml

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out diagnostics branch
        uses: actions/checkout@v4
        with:
          ref: agent/irremote-fix-runner
          fetch-depth: 0

      - name: Capture failed jobs and logs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: "29864189864"
        run: |
          set -euo pipefail
          jobs_json="$RUNNER_TEMP/jobs.json"
          out=".github/ir-ci-failures.txt"

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}/jobs?per_page=100" > "$jobs_json"

          {
            printf 'run_id=%s\n' "$TARGET_RUN_ID"
            printf 'failed_jobs=%s\n' "$(jq '[.jobs[] | select(.conclusion == "failure")] | length' "$jobs_json")"
            jq -r '.jobs[] | select(.conclusion == "failure") | "JOB\t\(.id)\t\(.name)\t\(.status)\t\(.conclusion)", (.steps[]? | select(.conclusion == "failure") | "STEP\t\(.number)\t\(.name)\t\(.status)\t\(.conclusion)")' "$jobs_json"
          } > "$out"

          while IFS=$'\t' read -r kind job_id rest; do
            [ "$kind" = "JOB" ] || continue
            printf '\n===== JOB %s LOG (tail 300 lines) =====\n' "$job_id" >> "$out"
            if gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${job_id}/logs" > "$RUNNER_TEMP/${job_id}.log" 2>/dev/null; then
              tail -n 300 "$RUNNER_TEMP/${job_id}.log" >> "$out"
            else
              printf 'Unable to download job log.\n' >> "$out"
            fi
          done < <(jq -r '.jobs[] | select(.conclusion == "failure") | "JOB\t\(.id)\t\(.name)"' "$jobs_json")

          git config user.name "openai-agent"
          git config user.email "openai-agent@users.noreply.github.com"
          git add "$out"
          git commit -m "runner: record IR CI failure diagnostics"
          git push origin HEAD:agent/irremote-fix-runner

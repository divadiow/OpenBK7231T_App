name: Inspect IR validation workflow

on:
  push:
    branches:
      - agent/irremote-fix-runner
    paths:
      - .github/workflows/inspect-ir-ci.yml

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect BK7238 IR job
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: '29866514887'
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" > "$RUNNER_TEMP/jobs.json"
          jq -r '.jobs[] | select(.name == "Build (OpenBK7238, irRemoteESP)") | [.id, .name, .status, (.conclusion // "-")] | @tsv' "$RUNNER_TEMP/jobs.json" > .github/last-bk7238-ir-job.txt
      - name: Commit summary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "openai-agent"
          git config user.email "openai-agent@users.noreply.github.com"
          git add .github/last-bk7238-ir-job.txt
          git commit -m "ci: record corrected BK7238 IR job status"
          git push

name: Keep IR helper branch out of build queue

on:
  push:
    branches:
      - agent/irremote-fix-runner
    paths:
      - .github/workflows/inspect-ir-ci.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel-helper-builds:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel queued and running Build App jobs for helper branch
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_WORKFLOW_ID: '148636797'
          HELPER_BRANCH: 'agent/irremote-fix-runner'
        shell: bash
        run: |
          set -euo pipefail
          for status in queued in_progress; do
            api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${BUILD_WORKFLOW_ID}/runs?branch=${HELPER_BRANCH}&status=${status}&per_page=100"
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api" | jq -r '.workflow_runs[].id' | while read -r run_id; do
                test -n "$run_id" || continue
                curl --fail --silent --show-error -X POST \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true
              done
          done

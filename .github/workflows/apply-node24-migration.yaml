name: Apply Node.js 24 Workflow Migration

on:
  push:
    branches:
      - agent/github-actions-node24
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  actions: write
  contents: write

jobs:
  migrate:
    name: Update production workflow actions
    runs-on: ubuntu-22.04
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}

    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Cancel superseded investigation runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while IFS= read -r run_id; do
            if [ -n "$run_id" ]; then
              echo "Cancelling superseded investigation run $run_id"
              gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true
            fi
          done < <(
            gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs?branch=${TARGET_BRANCH}&per_page=100" \
              --jq '.workflow_runs[] | select((.name == "Build App" or .name == "Node.js 24 Actions Smoke Test") and .status != "completed") | .id'
          )

      - name: Update official actions to Node.js 24 majors
        run: |
          workflow=.github/workflows/workflow.yaml

          sed -i \
            -e 's#actions/checkout@v4#actions/checkout@v5#g' \
            -e 's#actions/setup-python@v5#actions/setup-python@v6#g' \
            -e 's#actions/cache@v4#actions/cache@v5#g' \
            -e 's#actions/upload-artifact/merge@v4#actions/upload-artifact/merge@v6#g' \
            -e 's#actions/upload-artifact@v4#actions/upload-artifact@v6#g' \
            -e 's#actions/download-artifact@v4#actions/download-artifact@v7#g' \
            "$workflow"

          if grep -nE 'actions/checkout@v4|actions/setup-python@v5|actions/cache@v4|actions/upload-artifact@v4|actions/upload-artifact/merge@v4|actions/download-artifact@v4' "$workflow"; then
            echo 'One or more Node.js 20 official action references remain.' >&2
            exit 1
          fi

          grep -nE 'uses: actions/(checkout|setup-python|cache|upload-artifact|download-artifact)' "$workflow"
          git diff --check

      - name: Remove temporary investigation workflows
        run: |
          rm -f .github/workflows/node24-smoke.yaml
          rm -f .github/workflows/apply-node24-migration.yaml

      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows
          git status --short
          git commit -m 'Migrate GitHub Actions to Node.js 24'
          git push origin "HEAD:${TARGET_BRANCH}"

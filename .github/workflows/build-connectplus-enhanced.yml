name: Build ConnectPlus Enhanced APK

on:
  push:
    branches: ["connectplus-enhanced-builder"]
  pull_request:
    branches: ["connectplus-enhanced-builder"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out app source
        uses: actions/checkout@v4
        with:
          repository: divadiow/Misc
          ref: connectplus-enhanced-build
          path: source
      - name: Apply Charge 3/4 test2 patch
        run: |
          base64 -d source/ConnectPlusEnhanced/test2.patch.gz.b64 | gzip -d > /tmp/connectplus-test2.patch
          patch -p1 -d source < /tmp/connectplus-test2.patch
          grep -R "0.1.1-test2" source/ConnectPlusEnhanced/app/build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests
        working-directory: source/ConnectPlusEnhanced
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build debug APK
        working-directory: source/ConnectPlusEnhanced
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify output
        run: |
          test -s source/ConnectPlusEnhanced/app/build/outputs/apk/debug/app-debug.apk
          sha256sum source/ConnectPlusEnhanced/app/build/outputs/apk/debug/app-debug.apk | tee apk.sha256
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ConnectPlusEnhanced-v0.1.1-test2-debug-apk
          path: source/ConnectPlusEnhanced/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

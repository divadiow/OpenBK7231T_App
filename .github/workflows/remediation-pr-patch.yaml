name: Apply Remediation PR Patch

on:
  pull_request:
    branches:
      - agent/remediation-ci-base

permissions:
  contents: write

concurrency:
  group: remediation-pr-patch-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    name: Apply queued source patch
    runs-on: ubuntu-22.04
    steps:
      - name: Source checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2

      - name: Apply patch changed by the head commit
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          patch_file="$(git diff-tree --no-commit-id --name-only -r HEAD | grep '^.github/remediation-patches/.*\.patch$' | tail -n 1 || true)"
          if [ -z "$patch_file" ]; then
            echo "No remediation patch changed by the current head commit; nothing to apply."
            exit 0
          fi

          git apply --check "$patch_file"
          git apply "$patch_file"
          source_message="$(git log -1 --pretty=%s | sed 's/^queue: //')"
          git rm "$patch_file"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "$source_message"
          git push origin "HEAD:${HEAD_REF}"

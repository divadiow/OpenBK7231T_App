name: Recover outstanding IR adapter fixes

on:
  push:
    branches:
      - agent/irremote-recovery-runner
    paths:
      - .github/workflows/ir-recovery.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: irremote-push-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel only unnecessary helper-branch Build App runs
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_WORKFLOW_ID: "148636797"
          HELPER_BRANCH: "agent/irremote-recovery-runner"
        shell: bash
        run: |
          set -euo pipefail
          for status in queued in_progress; do
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${BUILD_WORKFLOW_ID}/runs?branch=${HELPER_BRANCH}&status=${status}&per_page=100" \
              --jq '.workflow_runs[].id' |
            while read -r run_id; do
              [ -n "$run_id" ] || continue
              gh api --method POST \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true
            done
          done

      - name: Check out recovery definition
        uses: actions/checkout@v4
        with:
          ref: agent/irremote-recovery-runner
          path: runner

      - name: Check out exact validated PR head
        uses: actions/checkout@v4
        with:
          ref: c7dbf61ed8ae2680ce311e20189a22d034697896
          fetch-depth: 0
          path: target

      - name: Apply source commits and focused tests
        id: recovery
        working-directory: target
        shell: bash
        env:
          EXPECTED_BASE: c7dbf61ed8ae2680ce311e20189a22d034697896
          STAGING_BRANCH: agent/irremote-recovery-staging
        run: |
          set +e
          {
            set -euo pipefail
            test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"
            test "$(git ls-remote origin refs/heads/irremotesp8266_290 | awk '{print $1}')" = "$EXPECTED_BASE"

            git switch -C "$STAGING_BRANCH"
            git config user.name "OpenAI-agent"
            git config user.email "openai-agent@users.noreply.github.com"

            cp "$GITHUB_WORKSPACE/runner/.github/ir-recovery.py" "$RUNNER_TEMP/ir-recovery.py"
            python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ['RUNNER_TEMP']) / 'ir-recovery.py'
          source = path.read_text()
          old = r"*end == '\0');"
          new = r"*end == '\\0');"
          if source.count(old) != 1:
              raise RuntimeError(f'null-literal recipe match count: {source.count(old)}')
          path.write_text(source.replace(old, new, 1))
          PY

            python3 "$RUNNER_TEMP/ir-recovery.py"
            python3 tests/ir_adapter_regression.py
            git diff --check
            git push --force origin "HEAD:refs/heads/${STAGING_BRANCH}"
          } 2>&1 | tee "$RUNNER_TEMP/ir-recovery.log"
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > "$RUNNER_TEMP/ir-recovery.status"
          tail -n 300 "$RUNNER_TEMP/ir-recovery.log" > "$RUNNER_TEMP/ir-recovery.tail"
          exit "$status"

      - name: Publish focused recovery status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status="unknown"
          [ -f "$RUNNER_TEMP/ir-recovery.status" ] && status="$(cat "$RUNNER_TEMP/ir-recovery.status")"
          {
            printf 'status=%s\n' "$status"
            printf 'workflow_run=%s\n' "$GITHUB_RUN_ID"
            printf 'target_base=c7dbf61ed8ae2680ce311e20189a22d034697896\n'
            if [ "$status" = "0" ]; then
              printf 'staging_head=%s\n' "$(git -C "$GITHUB_WORKSPACE/target" rev-parse HEAD)"
            fi
            printf '\n'
            [ -f "$RUNNER_TEMP/ir-recovery.tail" ] && cat "$RUNNER_TEMP/ir-recovery.tail"
          } > "$GITHUB_WORKSPACE/runner/.github/ir-recovery-status.txt"
          [ -f "$RUNNER_TEMP/ir-recovery.py" ] && cp "$RUNNER_TEMP/ir-recovery.py" "$GITHUB_WORKSPACE/runner/.github/ir-recovery.py"
          git -C "$GITHUB_WORKSPACE/runner" config user.name "OpenAI-agent"
          git -C "$GITHUB_WORKSPACE/runner" config user.email "openai-agent@users.noreply.github.com"
          git -C "$GITHUB_WORKSPACE/runner" add .github/ir-recovery-status.txt .github/ir-recovery.py
          git -C "$GITHUB_WORKSPACE/runner" commit -m "runner: record focused IR recovery status" || true
          git -C "$GITHUB_WORKSPACE/runner" push origin HEAD:agent/irremote-recovery-runner

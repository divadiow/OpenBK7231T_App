name: Apply Remediation Text Replacement

on:
  pull_request:
    branches:
      - agent/remediation-ci-base

permissions:
  contents: write

concurrency:
  group: remediation-pr-replace-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    name: Apply queued text replacement
    runs-on: ubuntu-22.04
    steps:
      - name: Source checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2

      - name: Apply replacement changed by the head commit
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          instruction_file="$(git diff-tree --no-commit-id --name-only --diff-filter=AM -r HEAD | grep '^.github/remediation-replacements/.*\.json$' | tail -n 1 || true)"
          if [ -z "$instruction_file" ]; then
            echo "No remediation replacement changed by the current head commit; nothing to apply."
            exit 0
          fi

          python3 - "$instruction_file" <<'PY'
          import json
          import pathlib
          import sys

          instruction_path = pathlib.Path(sys.argv[1])
          instruction = json.loads(instruction_path.read_text(encoding="utf-8"))
          target = pathlib.Path(instruction["path"])
          old = instruction["old"]
          new = instruction["new"]
          expected = int(instruction.get("expected_count", 1))
          text = target.read_text(encoding="utf-8")
          actual = text.count(old)
          if actual != expected:
              raise SystemExit(
                  f"Expected {expected} occurrence(s) of replacement text in {target}, found {actual}"
              )
          target.write_text(text.replace(old, new, expected), encoding="utf-8")
          print(f"Replaced {expected} occurrence(s) in {target}")
          PY

          source_message="$(git log -1 --pretty=%s | sed 's/^queue: //')"
          git rm "$instruction_file"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "$source_message"
          git push origin "HEAD:${HEAD_REF}"
